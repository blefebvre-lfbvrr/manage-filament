name: Bug
description: Signaler un problème
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: Que se passe-t-il ?
      description: Décris le problème et ce que tu attendais.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Étapes pour reproduire
      placeholder: |
        1. Aller sur…
        2. Cliquer sur…
        3. Constater…
    validations:
      required: true
  - type: input
    id: env
    attributes:
      label: Appareil / navigateur
      placeholder: ex. iPhone 15, Safari 18 (PWA installée)
  - type: input
    id: version
    attributes:
      label: Version de FilaTrack
      description: Visible en bas de la page Paramètres.
  - type: markdown
    attributes:
      value: '⚠️ Ne joins jamais ta sauvegarde complète ni un token GitHub. Un extrait anonymisé suffit.'
