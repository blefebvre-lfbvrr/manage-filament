<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta
      name="description"
      content="FilaTrack — gestion de stock de filaments pour Bambu Lab A1 Combo, hors ligne."
    />
    <meta name="theme-color" content="#1f8a5b" />
    <title>FilaTrack</title>
    <script>
      // Applique le thème avant le rendu pour éviter un flash.
      try {
        var t = JSON.parse(localStorage.getItem('filatrack:theme') || '"system"');
        var dark = t === 'dark' || (t === 'system' && matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.classList.toggle('dark', dark);
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
